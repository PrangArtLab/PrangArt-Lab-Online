name: Build & Deploy PrangArt Lab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Typecheck, Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build frontend bundle
        run: npm run build

      - name: Production server smoke test
        env:
          NODE_ENV: production
          PORT: 3099
        run: |
          node server.ts &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3099/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:3099/api/health
          curl -sf http://127.0.0.1:3099/api/bootstrap | grep -q "catalog"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3099/klien)
          test "$STATUS_CODE" = "200"

  deploy:
    name: Deploy to Cloud Run
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'prangart-lab-studio' }}
      REGION: ${{ vars.CLOUD_RUN_REGION || 'asia-east1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ] || [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Lengkapi GitHub Secrets (GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT) sebelum deploy."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy source to Cloud Run
        id: deploy-run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          source: .
          flags: >-
            --allow-unauthenticated
            --port=3000
            --session-affinity
            --min-instances=0
            --max-instances=3
            --timeout=300
          env_vars: |
            NODE_ENV=production
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            ADMIN_EMAIL=ADMIN_EMAIL:latest
            ADMIN_PASSWORD=ADMIN_PASSWORD:latest
            SESSION_SECRET=SESSION_SECRET:latest

      - name: Show deployed URL
        run: echo "Deployed URL: ${{ steps.deploy-run.outputs.url }}"
